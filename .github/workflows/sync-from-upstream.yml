name: Sync from upstream staging

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream and sync
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_PROJSYNC_PAT }}
        run: |
          echo "Token: ${UPSTREAM_TOKEN:0:10}..."
          echo "Token length: ${#UPSTREAM_TOKEN}"
          git ls-remote https://x-access-token:${UPSTREAM_TOKEN}@github.com/ims-hirosaki/projsync.git
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote add upstream https://x-access-token:${UPSTREAM_TOKEN}@github.com/ims-hirosaki/projsync.git
          git fetch upstream main
          git reset --hard upstream/main
          rm -rf .github/workflows/
          git add -A
          git commit --allow-empty -m "Remove upstream workflows"
          git push origin main --force
